# ═══════════════════════════════════════════════════════════════════════════════
# SLIDMS Hyperledger Fabric Network — Docker Compose
# 3 Organizations: PoliceDeptOrg, ForensicLabOrg, JudiciaryOrg
# Components: 1 Orderer, 3 Peers, 3 CouchDB instances, 3 CAs
# ═══════════════════════════════════════════════════════════════════════════════

version: '3.7'

volumes:
  orderer.slidms.gov.in:
  peer0.police.slidms.gov.in:
  peer0.forensic.slidms.gov.in:
  peer0.judiciary.slidms.gov.in:

networks:
  slidms_network:
    name: slidms_fabric_network

services:
  # ─── Orderer ────────────────────────────────────────────────────────────────
  orderer.slidms.gov.in:
    container_name: orderer.slidms.gov.in
    image: hyperledger/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
    working_dir: /root
    command: orderer
    volumes:
      - ../organizations/ordererOrganizations/slidms.gov.in/orderers/orderer.slidms.gov.in/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/slidms.gov.in/orderers/orderer.slidms.gov.in/tls:/var/hyperledger/orderer/tls
      - orderer.slidms.gov.in:/var/hyperledger/production/orderer
    ports:
      - 7050:7050
      - 7053:7053
    networks:
      - slidms_network

  # ─── Peer 0: Police Department ──────────────────────────────────────────────
  couchdb0:
    container_name: couchdb0
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=slidmsadmin
      - COUCHDB_PASSWORD=slidmspass
    ports:
      - 5984:5984
    networks:
      - slidms_network

  peer0.police.slidms.gov.in:
    container_name: peer0.police.slidms.gov.in
    image: hyperledger/fabric-peer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - DOCKER_API_VERSION=1.41
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=slidms_fabric_network
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.police.slidms.gov.in
      - CORE_PEER_ADDRESS=peer0.police.slidms.gov.in:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.police.slidms.gov.in:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.police.slidms.gov.in:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.police.slidms.gov.in:7051
      - CORE_PEER_LOCALMSPID=PoliceDeptMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=slidmsadmin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=slidmspass
      - CORE_PEER_GATEWAY_ENABLED=true
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/police.slidms.gov.in/peers/peer0.police.slidms.gov.in:/etc/hyperledger/fabric
      - ../config/core.yaml:/etc/hyperledger/fabric/core.yaml
      - peer0.police.slidms.gov.in:/var/hyperledger/production
    ports:
      - 7051:7051
    depends_on:
      - couchdb0
    networks:
      - slidms_network

  # ─── Peer 0: Forensic Lab ──────────────────────────────────────────────────
  couchdb1:
    container_name: couchdb1
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=slidmsadmin
      - COUCHDB_PASSWORD=slidmspass
    ports:
      - 7984:5984
    networks:
      - slidms_network

  peer0.forensic.slidms.gov.in:
    container_name: peer0.forensic.slidms.gov.in
    image: hyperledger/fabric-peer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - DOCKER_API_VERSION=1.41
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=slidms_fabric_network
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.forensic.slidms.gov.in
      - CORE_PEER_ADDRESS=peer0.forensic.slidms.gov.in:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.forensic.slidms.gov.in:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.forensic.slidms.gov.in:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.forensic.slidms.gov.in:9051
      - CORE_PEER_LOCALMSPID=ForensicLabMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb1:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=slidmsadmin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=slidmspass
      - CORE_PEER_GATEWAY_ENABLED=true
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/forensic.slidms.gov.in/peers/peer0.forensic.slidms.gov.in:/etc/hyperledger/fabric
      - ../config/core.yaml:/etc/hyperledger/fabric/core.yaml
      - peer0.forensic.slidms.gov.in:/var/hyperledger/production
    ports:
      - 9051:9051
    depends_on:
      - couchdb1
    networks:
      - slidms_network

  # ─── Peer 0: Judiciary ─────────────────────────────────────────────────────
  couchdb2:
    container_name: couchdb2
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=slidmsadmin
      - COUCHDB_PASSWORD=slidmspass
    ports:
      - 8984:5984
    networks:
      - slidms_network

  peer0.judiciary.slidms.gov.in:
    container_name: peer0.judiciary.slidms.gov.in
    image: hyperledger/fabric-peer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - DOCKER_API_VERSION=1.41
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=slidms_fabric_network
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.judiciary.slidms.gov.in
      - CORE_PEER_ADDRESS=peer0.judiciary.slidms.gov.in:11051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:11051
      - CORE_PEER_CHAINCODEADDRESS=peer0.judiciary.slidms.gov.in:11052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:11052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.judiciary.slidms.gov.in:11051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.judiciary.slidms.gov.in:11051
      - CORE_PEER_LOCALMSPID=JudiciaryMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb2:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=slidmsadmin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=slidmspass
      - CORE_PEER_GATEWAY_ENABLED=true
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/judiciary.slidms.gov.in/peers/peer0.judiciary.slidms.gov.in:/etc/hyperledger/fabric
      - ../config/core.yaml:/etc/hyperledger/fabric/core.yaml
      - peer0.judiciary.slidms.gov.in:/var/hyperledger/production
    ports:
      - 11051:11051
    depends_on:
      - couchdb2
    networks:
      - slidms_network

  # ─── Fabric CA: Police Department ──────────────────────────────────────────
  ca.police.slidms.gov.in:
    container_name: ca.police.slidms.gov.in
    image: hyperledger/fabric-ca:1.5
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-police
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - 7054:7054
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/fabric-ca/police:/etc/hyperledger/fabric-ca-server
    networks:
      - slidms_network

  # ─── Fabric CA: Forensic Lab ───────────────────────────────────────────────
  ca.forensic.slidms.gov.in:
    container_name: ca.forensic.slidms.gov.in
    image: hyperledger/fabric-ca:1.5
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-forensic
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=8054
    ports:
      - 8054:8054
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/fabric-ca/forensic:/etc/hyperledger/fabric-ca-server
    networks:
      - slidms_network

  # ─── Fabric CA: Judiciary ──────────────────────────────────────────────────
  ca.judiciary.slidms.gov.in:
    container_name: ca.judiciary.slidms.gov.in
    image: hyperledger/fabric-ca:1.5
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-judiciary
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=9054
    ports:
      - 9054:9054
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/fabric-ca/judiciary:/etc/hyperledger/fabric-ca-server
    networks:
      - slidms_network

  # ─── Fabric Tools CLI ─────────────────────────────────────────────────────
  cli:
    container_name: slidms-cli
    image: hyperledger/fabric-tools:2.5
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - FABRIC_LOGGING_SPEC=INFO
      - DOCKER_API_VERSION=1.41
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.police.slidms.gov.in:7051
      - CORE_PEER_LOCALMSPID=PoliceDeptMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/police.slidms.gov.in/peers/peer0.police.slidms.gov.in/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/police.slidms.gov.in/peers/peer0.police.slidms.gov.in/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/police.slidms.gov.in/peers/peer0.police.slidms.gov.in/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/police.slidms.gov.in/users/Admin@police.slidms.gov.in/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - ../organizations:/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations
      - ../chaincode:/opt/gopath/src/github.com/hyperledger/fabric/peer/chaincode
      - ../scripts:/opt/gopath/src/github.com/hyperledger/fabric/peer/scripts
    depends_on:
      - peer0.police.slidms.gov.in
      - peer0.forensic.slidms.gov.in
      - peer0.judiciary.slidms.gov.in
    networks:
      - slidms_network

  # ─── Chaincode Service (CCAAS) ───────────────────────────────────────────
  slidms-cc.police.slidms.gov.in:
    container_name: slidms-cc.police.slidms.gov.in
    image: node:18-alpine
    restart: always
    environment:
      - CORE_CHAINCODE_LOGLEVEL=info
    working_dir: /chaincode
    command: sh -c "npx fabric-chaincode-node server --chaincode-address=0.0.0.0:9999 --chaincode-id=slidms-cc_1.0:f6c5e1445391cb0e95e9796387dcc65ea8fb49f1fce02a67b10701a82ede8220"
    volumes:
      - ../chaincode:/chaincode
    ports:
      - 9999:9999
    networks:
      slidms_network:
        aliases:
          - slidms-cc.police.slidms.gov.in
          - slidms-cc



